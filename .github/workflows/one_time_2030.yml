name: One-time arXiv full run 20:30 BJT

on:
  push:
    paths:
      - '.github/arxiv_2030.trigger'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run latest arXiv report and send email
        env:
          TOKEN: ${{ github.token }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ismlyux@gmail.com
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_FROM: ismlyux@gmail.com
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          INCLUDES: ${{ vars.INCLUDES }}
          EXCLUDES: ${{ vars.EXCLUDES }}
        run: python main.py -t "${{ github.token }}"

      - name: Commit & push report to main
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md Arxiv_Daily_Notice/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "One-time arXiv full run $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:main
          fi
