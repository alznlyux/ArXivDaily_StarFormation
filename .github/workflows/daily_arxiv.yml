name: arXiv Daily (GA/SR + Email)

on:
  schedule:
    # 每周一到周五，北京 09:00（UTC 01:00）
    - cron: '0 1 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper, build report & send email
        env:
          # GitHub Actions 自动提供的短期 token，无需维护个人 PAT
          TOKEN: ${{ github.token }}

          # Gmail SMTP：仅 App Password 需要放到 Secret
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ismlyux@gmail.com
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_FROM: ismlyux@gmail.com
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # 可选：关键词覆盖；未设置时继续使用 config.py 默认值
          INCLUDES: ${{ vars.INCLUDES }}
          EXCLUDES: ${{ vars.EXCLUDES }}
        run: python main.py -t "${{ github.token }}"

      - name: Commit & push updates
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update arXiv daily $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
