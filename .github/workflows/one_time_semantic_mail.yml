name: One-time semantic arXiv validation email

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_semantic_mail.yml'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore semantic model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ism-semantic-models-${{ runner.os }}-v1
          restore-keys: |
            ism-semantic-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send one-time semantic validation email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USERNAME: ismlyux@gmail.com
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_FROM: ismlyux@gmail.com
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          from semantic_daily import fetch_daily_papers, apply_final_scope_guard, build_reports, send_email
          from semantic_recommender import score_papers

          issue_title, papers = fetch_daily_papers()
          scored, summary = score_papers(papers)
          scored, summary = apply_final_scope_guard(scored, summary)
          selected = [p for p in scored if p['priority'] in {'A', 'B'}]
          _, email_report = build_reports(issue_title, scored, summary)
          send_email(email_report, len(selected))
          print('[VALIDATION SUMMARY]', summary)
          print('[VALIDATION SELECTED]', len(selected))
          PY

      - name: Mark success
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/one_time_semantic_mail_success.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/one_time_semantic_mail_success.txt
          git commit -m 'Mark one-time semantic validation email success'
          git push
