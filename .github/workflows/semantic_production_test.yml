name: Semantic Recommender Production Smoke Test

on:
  push:
    branches: [feature/semantic-production-v2]
    paths:
      - 'semantic_*.py'
      - 'semantic_topics.json'
      - 'requirements.txt'
      - '.github/workflows/semantic_production_test.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore semantic model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ism-semantic-models-${{ runner.os }}-v1
          restore-keys: |
            ism-semantic-models-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile production code
        run: python -m py_compile semantic_daily.py semantic_recommender.py semantic_smoke_test.py

      - name: Run semantic smoke test
        run: python semantic_smoke_test.py
