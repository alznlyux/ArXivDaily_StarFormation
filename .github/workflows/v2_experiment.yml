name: ISM Literature Recommender v2 Experiment

on:
  push:
    branches: [v2-experiment]
    paths:
      - 'v2/**'
      - '.github/workflows/v2_experiment.yml'
  workflow_dispatch:
    inputs:
      days:
        description: 'Recent astro-ph lookback window in days'
        required: false
        default: '10'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: specter2-${{ runner.os }}-v1
          restore-keys: |
            specter2-${{ runner.os }}-

      - name: Install experiment dependencies
        run: pip install -r v2/requirements-v2.txt

      - name: Run contrastive SPECTER2 v2.1 experiment
        id: contrastive
        continue-on-error: true
        env:
          DAYS: ${{ inputs.days || '10' }}
        run: |
          mkdir -p v2_results
          set +e
          python v2/v2_contrastive.py --days "$DAYS" --output-dir v2_results 2>&1 | tee v2_results/contrastive-run.log
          status=${PIPESTATUS[0]}
          echo "$status" > v2_results/contrastive-exit-code.txt
          exit "$status"

      - name: Commit experiment results and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- v2_results/
          if git diff --cached --quiet; then
            echo "No experiment output changes."
          else
            git commit -m "Update v2.1 contrastive recommender experiment"
            git push
          fi

      - name: Fail job if contrastive experiment failed
        if: steps.contrastive.outcome == 'failure'
        run: exit 1
